<!doctype html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>दिलसे (DilSe) — ऑडियो, वीडियो कॉल और डेटिंग</title>
  <meta name="theme-color" content="#8B1DFF" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --font-sans: 'Noto Sans Devanagari', 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    body {
      font-family: var(--font-sans);
      background-color: #F3F4F6;
      color: #111827;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes pulseRing {
      0% { transform: scale(0.95); opacity: 0.8; }
      70% { transform: scale(1.25); opacity: 0; }
      100% { transform: scale(1.25); opacity: 0; }
    }
    .pulse-ring { animation: pulseRing 1.6s infinite; }
  </style>
</head>
<body class="flex justify-center min-h-screen bg-gray-200">

  <!-- Mobile App Shell -->
  <div id="app" class="w-full max-w-md bg-[#F7F8FA] min-h-screen flex flex-col shadow-2xl relative pb-20">

    <!-- Top Header -->
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-gray-100 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="relative">
          <img id="myAvatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120&h=120&fit=crop" alt="User" class="w-11 h-11 rounded-full object-cover border-2 border-purple-600" />
          <span class="w-3 h-3 bg-emerald-500 border-2 border-white rounded-full absolute bottom-0 right-0"></span>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 id="headerGreeting" class="font-bold text-base text-gray-900 leading-tight">नमस्ते, दिलसे यूज़र</h1>
          </div>
          <div class="flex items-center gap-1 mt-0.5">
            <span class="inline-flex items-center justify-center w-4 h-4 rounded-full bg-amber-400 text-[10px] font-extrabold text-amber-950">₹</span>
            <span id="coinBalance" class="text-xs font-bold text-gray-800">50.0</span>
            <span id="coinLabel" class="text-[11px] text-gray-500">(DilSe Coins)</span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="toggleLanguage()" id="langBtn" class="px-2.5 py-1.5 rounded-full text-xs font-bold bg-purple-50 text-purple-700 border border-purple-200">
          EN
        </button>
        <button onclick="openBuyCoinsModal()" id="buyCoinsBtn" class="bg-gradient-to-r from-[#8B1DFF] to-[#EC1D8D] text-white text-xs font-bold px-3.5 py-2 rounded-full shadow-sm active:scale-95 transition">
          + कॉइन्स खरीदें
        </button>
      </div>
    </header>

    <!-- Main Content Container -->
    <main id="mainContent" class="flex-1 px-4 pt-3 space-y-4 overflow-y-auto">
      <!-- Dynamic views rendered by JS -->
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 w-full max-w-md bg-white border-t border-gray-200 px-2 py-2 flex justify-around items-center z-30">
      <button onclick="switchTab('home')" id="nav-home" class="nav-btn flex flex-col items-center gap-0.5 text-purple-600 font-bold text-[11px]">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3L4 9v12h5v-7h6v7h5V9l-8-6z"/></svg>
        <span data-hi="होम" data-en="Home">होम</span>
      </button>
      <button onclick="switchTab('likes')" id="nav-likes" class="nav-btn flex flex-col items-center gap-0.5 text-gray-400 font-medium text-[11px] relative">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
        <span id="likesBadge" class="absolute -top-1 right-1 bg-pink-500 text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center">2</span>
        <span data-hi="पसंद" data-en="Likes">पसंद</span>
      </button>
      <button onclick="switchTab('chats')" id="nav-chats" class="nav-btn flex flex-col items-center gap-0.5 text-gray-400 font-medium text-[11px] relative">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
        <span id="chatBadge" class="absolute -top-1 right-1 bg-red-500 text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center">1</span>
        <span data-hi="चैट्स" data-en="Chats">चैट्स</span>
      </button>
      <button onclick="switchTab('profile')" id="nav-profile" class="nav-btn flex flex-col items-center gap-0.5 text-gray-400 font-medium text-[11px]">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span data-hi="प्रोफ़ाइल" data-en="Profile">प्रोफ़ाइल</span>
      </button>
    </nav>

    <!-- Active Call Overlay Modal -->
    <div id="callModal" class="hidden fixed inset-0 z-50 bg-gradient-to-b from-[#1e0936] via-[#2d0c52] to-[#110521] text-white flex flex-col items-center justify-between p-8">
      <div class="text-center mt-8">
        <span id="callTypeBadge" class="px-3 py-1 rounded-full bg-white/10 text-xs font-semibold tracking-wide uppercase">Private Audio Call</span>
        <h2 id="callPartnerName" class="text-2xl font-extrabold mt-4">Rakhi</h2>
        <p id="callStatusText" class="text-sm text-purple-200 mt-1">कॉल कनेक्ट हो रही है...</p>
        <p id="callTimer" class="text-lg font-mono font-bold text-amber-300 mt-2 hidden">00:00</p>
      </div>

      <div class="relative flex items-center justify-center">
        <div class="w-36 h-36 rounded-full bg-pink-500/30 absolute pulse-ring"></div>
        <img id="callPartnerAvatar" src="" alt="" class="w-32 h-32 rounded-full object-cover border-4 border-pink-400 relative z-10 shadow-2xl" />
      </div>

      <div class="w-full max-w-xs flex items-center justify-around mb-8">
        <button onclick="toggleMute(this)" class="w-14 h-14 rounded-full bg-white/15 flex items-center justify-center text-white active:scale-90 transition" title="Mute">
          🎤
        </button>
        <button onclick="endCall()" class="w-16 h-16 rounded-full bg-red-600 flex items-center justify-center text-white text-2xl shadow-lg shadow-red-600/40 active:scale-90 transition" title="End Call">
          📞
        </button>
        <button onclick="toggleSpeaker(this)" class="w-14 h-14 rounded-full bg-white/15 flex items-center justify-center text-white active:scale-90 transition" title="Speaker">
          🔊
        </button>
      </div>
    </div>

    <!-- Chat Drawer Modal -->
    <div id="chatModal" class="hidden fixed inset-0 z-40 bg-black/50 flex justify-center">
      <div class="w-full max-w-md bg-white h-full flex flex-col">
        <div class="px-4 py-3 border-b flex items-center justify-between bg-white">
          <div class="flex items-center gap-2.5">
            <button onclick="closeChat()" class="text-gray-600 font-bold text-lg px-1">←</button>
            <img id="chatPartnerAvatar" src="" class="w-10 h-10 rounded-full object-cover" />
            <div>
              <h3 id="chatPartnerName" class="font-bold text-sm text-gray-900">Rakhi</h3>
              <span class="text-[11px] text-emerald-600 font-semibold">● Online</span>
            </div>
          </div>
          <div class="flex gap-2">
            <button onclick="startCallFromChat('audio')" class="p-2 rounded-full bg-pink-50 text-pink-600 text-sm">📞</button>
            <button onclick="startCallFromChat('video')" class="p-2 rounded-full bg-emerald-50 text-emerald-600 text-sm">📹</button>
          </div>
        </div>

        <div id="chatMessages" class="flex-1 p-4 overflow-y-auto space-y-3 bg-[#F7F8FA]"></div>

        <form onsubmit="sendChatMessage(event)" class="p-3 bg-white border-t flex gap-2">
          <input id="chatInput" type="text" placeholder="संदेश लिखें..." class="flex-1 bg-gray-100 rounded-full px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-purple-500" required />
          <button type="submit" class="bg-gradient-to-r from-[#8B1DFF] to-[#EC1D8D] text-white font-bold px-5 py-2.5 rounded-full text-sm">
            भेजें
          </button>
        </form>
      </div>
    </div>

    <!-- Buy Coins Modal -->
    <div id="coinsModal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-end sm:items-center justify-center p-4">
      <div class="w-full max-w-md bg-white rounded-3xl p-5 space-y-4">
        <div class="flex justify-between items-center">
          <h3 id="coinsModalTitle" class="font-extrabold text-lg text-gray-900">DilSe Coins रीचार्ज करें</h3>
          <button onclick="closeBuyCoinsModal()" class="text-gray-400 hover:text-gray-700 text-xl font-bold">✕</button>
        </div>
        <p id="coinsModalSub" class="text-xs text-gray-500">प्राइवेट ऑडियो और लाइव वीडियो कॉल के लिए कॉइन्स जोड़ें।</p>
        <div class="grid grid-cols-2 gap-3">
          <button onclick="addCoins(50, 49)" class="border-2 border-purple-100 hover:border-purple-600 rounded-2xl p-3 text-left transition">
            <div class="text-amber-500 font-extrabold text-base">🪙 50 Coins</div>
            <div class="text-xs text-gray-500 mt-1">₹49 • Starter</div>
          </button>
          <button onclick="addCoins(150, 99)" class="border-2 border-purple-500 bg-purple-50/40 rounded-2xl p-3 text-left relative transition">
            <span class="absolute -top-2.5 right-2 bg-pink-600 text-white text-[9px] font-bold px-2 py-0.5 rounded-full">+30% BONUS</span>
            <div class="text-amber-500 font-extrabold text-base">🪙 150 Coins</div>
            <div class="text-xs text-gray-700 font-semibold mt-1">₹99 • Popular</div>
          </button>
          <button onclick="addCoins(400, 249)" class="border-2 border-purple-100 hover:border-purple-600 rounded-2xl p-3 text-left transition">
            <div class="text-amber-500 font-extrabold text-base">🪙 400 Coins</div>
            <div class="text-xs text-gray-500 mt-1">₹249 • VIP Pack</div>
          </button>
          <button onclick="addCoins(1000, 499)" class="border-2 border-purple-100 hover:border-purple-600 rounded-2xl p-3 text-left transition">
            <div class="text-amber-500 font-extrabold text-base">🪙 1000 Coins</div>
            <div class="text-xs text-gray-500 mt-1">₹499 • Royal Club</div>
          </button>
        </div>
      </div>
    </div>

  </div>

  <script>

    let currentTab = 'home';
    let filterMode = 'all';
    let coins = 50.0;
    let activeChatProfile = null;
    let activeCallProfile = null;
    let callInterval = null;
    let callSeconds = 0;

    let userProfile = JSON.parse(localStorage.getItem('dilse_user_profile') || 'null') || {
      name: 'दिलसे यूज़र',

      bio: 'संगीत, कॉफ़ी और सार्थक बातचीत पसंद है।'

      {

        cityHi: 'जयपुर',
        cityEn: 'Jaipur',

        bioEn: 'Always bringing good humor and positive vibes.'
      }
    ];

    const chatHistory = {
      p1: [
        { from: 'them', text: 'नमस्ते! कैसे हैं आप? 😊' }
      ]
    };

    function t(hi, en) {
      return currentLang === 'en' ? en : hi;
    }

    function updateHeader() {
      document.getElementById('headerGreeting').textContent = t(`नमस्ते, ${userProfile.name}`, `Hi, ${userProfile.name}`);
      document.getElementById('coinBalance').textContent = coins.toFixed(1);
      document.getElementById('buyCoinsBtn').textContent = t('+ कॉइन्स खरीदें', '+ Buy Coins');
      document.getElementById('langBtn').textContent = currentLang === 'hi' ? 'EN' : 'हिन्दी';
      document.querySelectorAll('.nav-btn span[data-hi]').forEach(el => {
        el.textContent = el.getAttribute(`data-${currentLang}`);
      });
    }

    function toggleLanguage() {
      currentLang = currentLang === 'hi' ? 'en' : 'hi';
      updateHeader();
      render();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-purple-600', 'font-bold');
        btn.classList.add('text-gray-400', 'font-medium');
      });
      const activeBtn = document.getElementById(`nav-${tab}`);
      if (activeBtn) {
        activeBtn.classList.remove('text-gray-400', 'font-medium');
        activeBtn.classList.add('text-purple-600', 'font-bold');
      }
      render();
    }

        if (filterMode === 'vip') return p.vip;
        return true;
      });

            <div class="font-extrabold text-xs mt-1">${t('ऑडियो कॉल', 'Private Audio')}</div>
            <div class="text-[10px] text-pink-100 mt-0.5">${t('तुरंत बात करें', 'Instant Voice')}</div>
          </button>
          <button onclick="startQuickRandomCall('video')" class="rounded-2xl p-3 text-left bg-gradient-to-b from-[#1B7F4E] to-[#0F4C2E] text-white shadow active:scale-95 transition">

            <div class="font-extrabold text-xs mt-1">${t('वीडियो कॉल', 'Private Video')}</div>

        <div class="flex items-center justify-between pt-1">
